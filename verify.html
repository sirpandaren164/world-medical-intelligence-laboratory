<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Certificate · Hormone eLearning</title><link rel="stylesheet" href="app/style.css?v=20260920"></head><body><div class="wrap"><div class="topbar"><div class="brand"><div class="brandmark">WMC</div><div>Certificate Verification<br><span class="small">Hormone eLearning</span></div></div><div class="nav"><a class="btn" href="index.html">Course Home</a></div></div><div class="verify-box card"><div class="verify-icon" id="icon">✓</div><h1 class="center">Verify Certificate</h1><div class="field"><label>Certificate ID</label><input id="idInput" placeholder="HORM-2026-XXXXXXXX"></div><button class="btn primary" id="checkBtn">ตรวจสอบ · Verify</button><div id="verifyResult" style="margin-top:18px"></div><div class="callout" style="margin-top:18px">กรอก Certificate ID หรือสแกน QR Code เพื่อตรวจสอบข้อมูลใบประกาศ</div></div></div><script src="app/shared.js?v=20260920"></script><script>
const q=new URLSearchParams(location.search);idInput.value=q.get('id')||'';async function verify(){const id=idInput.value.trim();if(!id){verifyResult.innerHTML='<div class="result fail">กรุณาใส่ Certificate ID</div>';return}let registry=[];try{const r=await fetch('certificates.json?ts='+Date.now());if(r.ok)registry=await r.json()}catch(e){}const pub=registry.find(x=>x.id===id);const local=getCert();if(pub){icon.textContent='✓';icon.style.background='#e8f7f1';verifyResult.innerHTML=`<div class="result pass"><h2>Verified ✓</h2><p><b>${esc(pub.name)}</b></p><p>${esc(pub.courseTitle||'Hormone Therapy & Healthy Aging E-Learning Program')}</p><p>Certificate ID: ${esc(pub.id)}<br>Score: ${esc(pub.score)}%<br>Issued: ${fmtDate(pub.issuedAt)}</p></div>`}else if(local&&local.id===id){icon.textContent='✓';verifyResult.innerHTML=`<div class="result pass"><h2>Verified ✓</h2><p><b>${esc(local.name)}</b></p><p>${esc(local.courseTitle||'Hormone Therapy & Healthy Aging E-Learning Program')}</p><p>Certificate ID: ${esc(local.id)}<br>Score: ${esc(local.score)}%<br>Issued: ${fmtDate(local.issuedAt)}</p></div>`}else{icon.textContent='?';icon.style.background='#fff6df';verifyResult.innerHTML=`<div class="result fail"><h2>Certificate not found</h2><p>ไม่พบข้อมูล Certificate ID นี้ กรุณาตรวจสอบหมายเลขอีกครั้ง</p></div>`}}checkBtn.onclick=verify;if(idInput.value)verify();
</script></body></html>
